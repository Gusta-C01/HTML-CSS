<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personalização dos fundos </title>
    <style>
        body {
            background-image: url('https://gustavoguanabara.github.io/html-css/imagens/mascote.png');
            background-size: 100px 100px;
            /* Define o tamanho da imagem de fundo:
            100px 100px -> Largura e altura exatas (pode esticar/achatar se não for proporcional)
            100px       -> Define apenas a largura; a altura ajusta sozinha sem distorcer
            auto        -> Tamanho original real da imagem (padrão)
            cover       -> Estica ou corta a imagem para cobrir toda a área sem sobrar espaço vazio
            contain     -> Ajusta a imagem inteira dentro da área sem cortar nada (pode sobrar borda) */

            background-repeat: repeat-y;
            /* Controla a repetição da imagem de fundo:
            repeat    -> Repete na horizontal e vertical (padrão)
            no-repeat -> Mostra a imagem apenas uma vez, sem repetir
            repeat-x  -> Repete apenas na horizontal (de lado)
            repeat-y  -> Repete apenas na vertical (de cima para baixo) */
background-repeat: repeat-y;
        }
    </style>
</head>
<body>
    
</body>
</html>
