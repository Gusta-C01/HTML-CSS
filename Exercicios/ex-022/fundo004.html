<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Posicionamento</title>
    <style>
        body{
            height: 98vh; /* vh = Viewport Height (altura da janela). 98vh ocupa 98% da tela, e tbm pode tirar a barra de rolagem*/

            border: 1px dashed black; /* Borda tracejada só para visualizar o limite da caixa */
            background-image: url('https://gustavoguanabara.github.io/html-css/imagens/mascote.png');
            background-size: 100px; /* Largura de 100px; a altura ajusta sozinha sem distorcer */

            background-repeat: no-repeat; /* Mostra a imagem só uma vez (não espalha) */

            background-position: center center; /* [horizontal] [vertical]: left, center, right / top, center, bottom */
        }
    </style>
</head>
<body>
    
</body>
</html>
