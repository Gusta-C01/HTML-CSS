<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Posição dos Fundos</title>
    <style>
        div.bloco {
            background-image: url(imagens/wallpaper003.jpg);
            height: 200px;
            border: 1px solid black;
            border-radius: 20px;
            margin: 20px;
        }
        /* Posição da imagem de fundo: [horizontal] [vertical] */

        div#q1 {
            /* Gruda a imagem no canto superior esquerdo (padrão do CSS) */
            background-position: left top;
        }

        div#q2 {
            /* Gruda na borda esquerda e centraliza na altura */
            background-position: left center;
        }

        div#q3 {
            /* Gruda no canto inferior direito */
            background-position: right bottom;
        }

        div#q4 {
            /* Centraliza perfeitamente no meio da caixa (horizontal e vertical) */
            background-position: center center;
        }
    </style>
</head>
<body>
    <div class="bloco" id="q1">

    </div>
    <div class="bloco" id="q2">

    </div>
    <div class="bloco" id="q3">

    </div>
    <div class="bloco" id="q4">

    </div>
   
</body>
</html>
